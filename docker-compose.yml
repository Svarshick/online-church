services:
  postgres_dwh:
    image: postgres:16-alpine
    container_name: church_postgres
    environment:
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: church_secret
      POSTGRES_DB: church_dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_church_data:/var/lib/postgresql/data
      - ./docs/church_db_init.sql:/docker-entrypoint-initdb.d/01_church_oltp.sql:ro
      - ./analytics/sql/01_init_dwh.sql:/docker-entrypoint-initdb.d/02_church_dwh.sql:ro
      - ./analytics/sql/03_seed_demo_donations.sql:/docker-entrypoint-initdb.d/03_seed_demo_donations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_dwh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: church_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://church_admin:church_secret@postgres_dwh:5432/church_dwh
      - CHAT_PROVIDER=${CHAT_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-1500}
      - OPENROUTER_REASONING=${OPENROUTER_REASONING:-low}
      - HIVE_API_KEY=${HIVE_API_KEY:-}
      - HIVE_MODEL=${HIVE_MODEL:-deepseek-ai/deepseek-v4.1-flash}
      - HIVE_BASE_URL=${HIVE_BASE_URL:-https://api-cdn.thehive.ai/api/v3}
      - HIVE_TIMEOUT_SECONDS=${HIVE_TIMEOUT_SECONDS:-30}
      - HIVE_MAX_TOKENS=${HIVE_MAX_TOKENS:-1500}
      - HIVE_REASONING_EFFORT=${HIVE_REASONING_EFFORT:-}
      - HIVE_TEMPERATURE=${HIVE_TEMPERATURE:-0.4}
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres_dwh:
        condition: service_healthy

  analytics_api:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    container_name: church_analytics
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres_dwh
      - POSTGRES_PORT=5432
      - POSTGRES_USER=church_admin
      - POSTGRES_PASSWORD=church_secret
      - POSTGRES_DB=church_dwh
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres_dwh:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: church_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Read by the browser, so these must be host-reachable addresses (not docker service names).
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_ANALYTICS_URL=${VITE_ANALYTICS_URL:-http://localhost:8000}
    depends_on:
      - backend_api
      - analytics_api

volumes:
  postgres_church_data:
